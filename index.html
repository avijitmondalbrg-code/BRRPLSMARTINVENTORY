
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remix: BRG Inventory Manager V 1.0</title>
    <meta name="description" content="A comprehensive hearing aid inventory and patient billing system with stock transfer capabilities." />
    <meta property="og:title" content="Remix: BRG Inventory Manager V 1.0" />
    <meta property="og:description" content="A comprehensive hearing aid inventory and patient billing system with stock transfer capabilities." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      window.process = { env: { API_KEY: '' } };
      
      // DESIGN SYSTEM LOCK: Fixed configuration for color and branding
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: '#3159a6',   // BRG Blue
              secondary: '#254687', // Darker Blue
              accent: '#14b8a6',    // Teal Accent
              surface: '#f3f4f6',   // App Background
            },
            borderRadius: {
              'invoice': '2.5rem',
              'card': '2rem',
              'input': '1rem'
            }
          }
        }
      }
    </script>
    <style>
      /* BASE STYLES LOCK */
      body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; margin: 0; padding: 0; }
      
      /* PRINT ARCHITECTURE LOCK */
      @media print {
        @page {
          size: var(--print-size, A4) var(--print-orientation, portrait);
          margin: 10mm;
        }
        body * { visibility: hidden !important; }
        #root, #root * { visibility: visible !important; }
        #invoice-printable-area, #invoice-printable-area * { visibility: visible !important; }

        #invoice-printable-area {
          position: absolute !important;
          left: 0 !important;
          top: 0 !important;
          width: 100% !important;
          height: auto !important;
          margin: 0 !important;
          padding: 0 !important;
          background: white !important;
          z-index: 9999 !important;
          display: block !important;
          box-shadow: none !important;
          border: none !important;
          transform: scale(var(--print-scale, 1)) !important;
          transform-origin: top left !important;
        }
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        .print\:hidden { display: none !important; visibility: hidden !important; }
      }

      /* CUSTOM SCROLLBAR DESIGN LOCK */
      .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 10px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 8px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #3159a6; border-radius: 8px; border: 2px solid #e2e8f0; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #254687; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
